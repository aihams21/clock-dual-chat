<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>الدردشة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ شاشة الدخول / التسجيل ============ -->
<section id="auth" class="screen active">
  <div class="auth-wrap">
    <div class="logo">💬</div>
    <h1>الدردشة</h1>
    <p class="sub" id="auth-sub">سجّل دخولك</p>

    <form id="auth-form" autocomplete="on" novalidate>
      <label id="wrap-username" class="hidden">
        <span>اسم المستخدم</span>
        <input id="username" type="text" autocapitalize="none" autocorrect="off"
               placeholder="ahmed" minlength="2" maxlength="24" pattern="[A-Za-z0-9_.\-]+">
        <small>حروف إنجليزية وأرقام فقط</small>
      </label>

      <label id="wrap-name" class="hidden">
        <span>الاسم الظاهر</span>
        <input id="displayname" type="text" placeholder="أحمد" maxlength="40">
      </label>

      <label>
        <span>الإيميل</span>
        <input id="email" type="email" autocapitalize="none" autocorrect="off" required>
      </label>

      <label>
        <span>كلمة السر</span>
        <input id="password" type="password" required minlength="6">
      </label>

      <p id="auth-error" class="error"></p>
      <button type="submit" id="auth-submit" class="btn primary">دخول</button>
    </form>

    <button id="toggle-mode" class="link">ما عندك حساب؟ سجّل جديد</button>
  </div>
</section>

<!-- ============ شاشة البحث عن شخص ============ -->
<section id="search" class="screen">
  <header class="topbar">
    <div class="me">
      <div class="avatar" id="me-avatar">؟</div>
      <div class="me-info">
        <b id="me-name">…</b>
        <small>@<span id="me-username">…</span></small>
      </div>
    </div>
    <button id="logout" class="btn ghost sm">خروج</button>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="اكتب حرفين من اسم المستخدم…"
           autocapitalize="none" autocorrect="off" autocomplete="off">
  </div>

  <p id="search-hint" class="hint">اكب حرفين على الأقل</p>
  <ul id="results" class="results"></ul>
</section>

<!-- ============ شاشة المحادثة ============ -->
<section id="chat" class="screen">
  <header class="topbar">
    <button id="back" class="btn icon" aria-label="رجوع">→</button>
    <div class="avatar" id="peer-avatar">؟</div>
    <div class="me-info">
      <b id="peer-name">…</b>
      <small id="peer-status">@<span id="peer-username"></span></small>
    </div>
  </header>

  <div id="thread" class="thread"></div>

  <form id="composer" class="composer">
    <button type="button" id="cancel-edit" class="btn ghost sm hidden">إلغاء</button>
    <textarea id="msg" rows="1" placeholder="اكتب رسالة…"
              maxlength="4000" enterkeyhint="send"></textarea>
    <button type="submit" id="send" class="btn primary round" aria-label="إرسال">➤</button>
  </form>
</section>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
